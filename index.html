<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Movie Months">
<meta name="theme-color" content="#f5f4ef">
<title>Movie Months</title>
<style>
  :root{
    --bg:#f5f4ef; --panel:#ffffff; --panel2:#eef1ea; --line:#dbded5;
    --text:#1b2a20; --muted:#5e6a61; --faint:#98a29a;
    --red:#ce1126; --red-dim:#a30d1e; --green:#0a7d3f; --green-dim:#0a5c30;
    --danger:#ce1126;
    --radius:14px; --shadow:0 14px 30px -20px rgba(20,45,28,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 16px}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 0 6px;
  }
  h1{
    font-family:Georgia, "Times New Roman", serif; font-weight:600;
    font-size:26px; margin:0; letter-spacing:.3px;
  }
  h1 .tick{color:var(--green)}
  .iconbtn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:12px; min-width:44px; min-height:44px; font-size:19px; cursor:pointer;
  }
  .iconbtn:active{background:var(--panel2)}

  .tabs{display:flex; gap:8px; margin:10px 0 14px}
  .tab{
    flex:1; min-height:46px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-size:16px; cursor:pointer;
  }
  .tab.active{background:var(--red); border-color:var(--red); color:#fff; font-weight:600}

  .monthbar{display:flex; gap:8px; margin-bottom:10px}
  select, input[type="text"], input[type="search"], input[type="date"], input[type="month"],
  input[type="password"], input:not([type]), textarea{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:11px 12px; font-size:16px; min-height:46px; width:100%;
    appearance:none; -webkit-appearance:none; font-family:inherit;
  }
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--green)}
  #monthSelect{flex:1}
  .ghost{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:12px; padding:0 14px; min-height:46px; font-size:15px; cursor:pointer; white-space:nowrap;
  }
  .ghost:active{background:var(--panel)}

  #themeInput{margin-bottom:8px; font-style:italic}
  .progress{color:var(--faint); font-size:13.5px; margin:0 2px 12px}

  .searchbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
  .searchbar input{flex:2 1 160px}
  .searchbar select{flex:1 1 100px; width:auto}

  .row{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .row:active{background:var(--panel2)}
  .day{
    font-family:Georgia, serif; font-size:20px; color:var(--green);
    min-width:38px; height:38px; border:1px solid var(--line); border-radius:10px;
    display:flex; align-items:center; justify-content:center; flex:none; background:var(--bg);
  }
  .meat{flex:1; min-width:0}
  .t{font-size:16.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis}
  .t .yr{color:var(--muted); font-weight:400; font-size:14.5px}
  .mk{font-size:14px; font-weight:700; vertical-align:1px; cursor:default}
  .mk1001{color:var(--green)}
  .mkss{
    color:var(--red); background:none; border:none; padding:0 1px;
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  .sub{color:var(--muted); font-size:13.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis}
  .mo{color:var(--green-dim); font-size:12.5px; margin-top:2px}
  .imdb{
    flex:none; color:var(--green); text-decoration:none; font-size:12.5px; font-weight:700;
    border:1px solid var(--green-dim); border-radius:8px; padding:7px 9px;
  }
  .grouphead{
    color:var(--faint); font-size:13px; text-transform:uppercase; letter-spacing:.08em;
    margin:16px 2px 8px;
  }
  .empty{color:var(--faint); text-align:center; padding:36px 12px; font-size:15px}

  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--red); color:#fff; border:none; border-radius:999px;
    padding:15px 26px; font-size:17px; font-weight:700; cursor:pointer;
    box-shadow:var(--shadow); min-height:52px; max-width:90vw; white-space:nowrap;
  }
  .fab:active{filter:brightness(.92)}

  .nbAdd{display:flex; gap:8px; margin-bottom:14px}
  .nbAdd input{flex:1}
  .nbAdd button{
    background:var(--red); color:#fff; border:none; border-radius:12px;
    padding:0 18px; font-size:16px; font-weight:600; min-height:46px; cursor:pointer;
  }
  .note{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; cursor:pointer; white-space:pre-wrap; word-break:break-word;
  }
  .note:active{background:var(--panel2)}
  .note .when{color:var(--faint); font-size:12px; margin-top:4px}

  .banner{
    background:var(--panel); border:1px solid var(--green-dim); border-radius:var(--radius);
    padding:16px; margin:10px 0; text-align:center;
  }
  .banner p{margin:0 0 12px; color:var(--muted); font-size:15px}
  .banner button{
    background:var(--red); color:#fff; border:none; border-radius:12px;
    padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer;

  .overlay{
    position:fixed; inset:0; background:rgba(18,32,23,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);

  .overlay.upper{z-index:60}
  @media(min-width:640px){ .overlay{align-items:center} }
  .modal{
    background:var(--panel); border:1px solid var(--line); width:100%; max-width:560px;
    border-radius:20px 20px 0 0; box-shadow:var(--shadow);
    max-height:88vh; max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;

  .modal h2{
    font-family:Georgia, serif; font-size:20px; font-weight:600; margin:0 0 14px;
  }
  .mhead{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .mhead h2{margin:0}
  .x{background:none; border:none; color:var(--faint); font-size:24px; cursor:pointer; padding:6px 10px}
  .field{margin-bottom:11px}
  .field label{display:block; color:var(--muted); font-size:13px; margin:0 2px 5px}
  .frow{display:flex; gap:10px}
  .frow .field{flex:1}
  .mbtns{display:flex; gap:10px; margin-top:16px}
  .btn{
    flex:1; min-height:48px; border-radius:12px; border:none; font-size:16px;
    font-weight:600; cursor:pointer;
  }
  .btn.primary{background:var(--red); color:#fff}
  .btn.plain{background:var(--panel2); color:var(--text); border:1px solid var(--line)}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger); flex:0 0 auto; padding:0 16px}
  .btn:disabled{opacity:.45; cursor:default}
  .help{color:var(--faint); font-size:13px; margin:8px 2px; line-height:1.5}
  .linky{background:none; border:none; color:var(--green); font-size:14.5px; cursor:pointer; padding:8px 2px; text-decoration:underline}

  .cand{
    display:block; width:100%; text-align:left; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:7px;
    color:var(--text); font-size:15.5px; cursor:pointer;
  }
  .cand:active{border-color:var(--green)}
  .cand .d{color:var(--muted); font-size:13.5px; margin-top:2px}
  .searching{color:var(--faint); padding:14px 4px; font-size:14.5px}

  .impItem{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:8px;
  }
  .impItem .top{display:flex; align-items:center; gap:8px}
  .impItem .name{flex:1; font-size:15.5px; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .impItem.done .name{color:var(--text)}
  .impItem.skipped .name{color:var(--faint); text-decoration:line-through}
  .impItem .st{font-size:12.5px; color:var(--muted); margin-top:3px}
  .impItem .st.ok{color:var(--green)}
  .mini{
    background:var(--bg); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:8px 11px; font-size:13.5px; cursor:pointer; flex:none;
  }
  .mini:active{border-color:var(--green)}

  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom)); z-index:80;
    background:#20302a; border:1px solid rgba(255,255,255,.14); color:#f4f7f2;
    border-radius:12px; padding:11px 18px; font-size:14.5px; box-shadow:var(--shadow);
    max-width:88vw; text-align:center;
  }
  .toast.bad{border-color:var(--danger)}
  .spin{
    display:inline-block; width:14px; height:14px; border:2px solid var(--faint);
    border-top-color:var(--green); border-radius:50%; animation:sp .8s linear infinite;
    vertical-align:-2px; margin-right:7px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div class="wrap">
  <header>
    <h1><span class="tick">▮</span> Movie Months</h1>
    <button id="settingsBtn" class="iconbtn" title="Settings">⚙</button>
  </header>

  <div id="setupBanner" class="banner" hidden>
    <p>Connect to GitHub to load and save your marathons. You'll need the shared access token.</p>
    <button id="setupBtn">Set up</button>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="marathon">Marathon</button>
    <button class="tab" data-tab="notebook">Notebook</button>
  </nav>

  <section id="view-marathon">
    <div class="monthbar">
      <select id="monthSelect"></select>
    </div>
    <input id="themeInput" type="text" placeholder="Theme for this month (optional)" autocomplete="off">
    <div id="progress" class="progress"></div>
    <div class="searchbar">
      <input id="searchInput" type="search" placeholder="Search movies…" autocomplete="off">
      <select id="fieldSelect"></select>
      <select id="scopeSelect">
        <option value="month">This month</option>
        <option value="all">All months</option>
      </select>
    </div>
    <div id="entryList"></div>
  </section>

  <section id="view-notebook" hidden>
    <div class="nbAdd">
      <input id="nbInput" type="text" placeholder="Jot an idea… (director, decade, country, anything)" autocomplete="off">
      <button id="nbAddBtn">Add</button>
    </div>
    <div id="nbList"></div>
  </section>
</div>

<button id="addBtn" class="fab">＋ Add today’s movie</button>

<div id="overlay" class="overlay" hidden><div class="modal" id="modalBox"></div></div>
<div id="pickerOverlay" class="overlay upper" hidden><div class="modal" id="pickerBox"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const currentMonthKey = () => todayISO().slice(0,7);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(key){
  const [y,m] = key.split('-');
  return (MONTHS[+m-1] || m) + ' ' + y;
}
function daysInMonth(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
let toastTimer = null;
function toast(msg, bad){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 5000 : 2600);
}
function showErr(e){
  if (e && e.code === 'auth') toast('GitHub rejected the token — check Settings ⚙', true);
  else if (e && e.code === 'norepo') toast('Data repo not reachable — check Settings ⚙', true);
  else if (e && e.code === 'wikidata') toast('Wikidata is unreachable right now', true);
  else if (e instanceof TypeError) toast('Network error — are you offline?', true);
  else toast('That didn’t save (HTTP ' + ((e && e.status) || '?') + ') — try again', true);
  console.error(e);
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ============================== config ============================== */
const LS = { token:'mm_token', owner:'mm_owner', repo:'mm_repo' };
function cfgGet(k, d){ try{ const v = localStorage.getItem(LS[k]); return v == null || v === '' ? d : v; }catch(e){ return d; } }
function cfgSet(k, v){ try{ localStorage.setItem(LS[k], v); }catch(e){} }
const gh = () => ({ token:cfgGet('token',''), owner:cfgGet('owner','clwesterl'), repo:cfgGet('repo','movie-months-data') });
const ghConfigured = () => { const c = gh(); return !!(c.token && c.owner && c.repo); };

/* ======================= GitHub Contents API ======================== */
const NOTEBOOK_PATH = 'notebook.json';
const marathonPath = key => 'marathons/' + key + '.json';
function ghUrl(path){
  const c = gh();
  return 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) +
         '/contents/' + path.split('/').map(encodeURIComponent).join('/');
}
function ghHeaders(){
  return {
    'Authorization':'Bearer ' + gh().token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
}
function ghError(res){
  if (res.status === 401 || res.status === 403) return { code:'auth', status:res.status };
  if (res.status === 409) return { code:'conflict', status:409 };
  return { code:'http', status:res.status };
}
// -> {doc, sha} or null when the file doesn't exist yet
async function ghGetFile(path){
  const res = await fetch(ghUrl(path), { headers:ghHeaders(), cache:'no-store' });
  if (res.status === 404) return null;
  if (!res.ok) throw ghError(res);
  const j = await res.json();
  return { doc: JSON.parse(b64decode(j.content)), sha: j.sha };
}
async function ghPutFile(path, doc, sha, message){
  const body = { message, content: b64encode(JSON.stringify(doc, null, 2)) };
  if (sha) body.sha = sha;
  const res = await fetch(ghUrl(path), {
    method:'PUT',
    headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()),
    body: JSON.stringify(body)
  });
  if (!res.ok) throw ghError(res);
  const j = await res.json();
  return j.content && j.content.sha;
}
async function ghDeleteFile(path, sha, message){
  const res = await fetch(ghUrl(path), {
    method:'DELETE',
    headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()),
    body: JSON.stringify({ message, sha })
  });
  if (!res.ok) throw ghError(res);
}
// -> [] when the directory doesn't exist yet
async function ghListDir(path){
  const res = await fetch(ghUrl(path), { headers:ghHeaders(), cache:'no-store' });
  if (res.status === 404) return [];
  if (!res.ok) throw ghError(res);
  return res.json();
}
// read-mutate-write; refetches once on a sha conflict (two devices, one file)
async function updateFile(path, emptyDoc, mutate, message){
  for (let attempt = 0; attempt < 2; attempt++){
    const cur = await ghGetFile(path);
    const doc = cur ? cur.doc : JSON.parse(JSON.stringify(emptyDoc));
    mutate(doc);
    try{
      const sha = await ghPutFile(path, doc, cur && cur.sha, message);
      return { doc, sha };
    }catch(e){
      if (e && e.code === 'conflict' && attempt === 0) continue;
      throw e;
    }
  }
}

/* ============================ Wikidata ============================== */
const WD_API = 'https://www.wikidata.org/w/api.php';
async function wdApi(params){
  const q = new URLSearchParams(Object.assign({ format:'json', origin:'*' }, params));
  let res;
  try{ res = await fetch(WD_API + '?' + q); }
  catch(e){ throw { code:'wikidata' }; }
  if (!res.ok) throw { code:'wikidata', status:res.status };
  return res.json();
}
// Two searches, merged: a fulltext search restricted to film items (so
// short titles like "Z" aren't buried under every entity starting with
// that letter), then the label/alias prefix search (which catches partial
// typing the fulltext search can't). Film-filtered hits come first.
const FILM_CLASSES = ['Q11424','Q24862','Q506240','Q202866','Q93204']; // film, short, TV, animated, documentary
async function wdFilmSearch(text){
  const filter = ' haswbstatement:' + FILM_CLASSES.map(q => 'P31=' + q).join('|P31=');
  const j = await wdApi({ action:'query', list:'search', srsearch:text + filter, srlimit:'10' });
  const ids = ((j.query && j.query.search) || []).map(r => r.title).filter(t => /^Q\d+$/.test(t));
  if (!ids.length) return [];
  const ej = await wdApi({ action:'wbgetentities', ids:ids.join('|'), props:'labels|descriptions', languages:'en' });
  return ids.map(q => {
    const e = (ej.entities && ej.entities[q]) || {};
    return {
      id: q,
      label: (e.labels && e.labels.en && e.labels.en.value) || q,
      description: (e.descriptions && e.descriptions.en && e.descriptions.en.value) || ''
    };
  });
}
async function wdLabelSearch(text){
  const j = await wdApi({ action:'wbsearchentities', search:text, language:'en', uselang:'en', type:'item', limit:'20' });
  const all = (j.search || []).map(r => ({ id:r.id, label:r.label || '', description:r.description || '' }));
  const isFilm = r => /\bfilms?\b|\bmovie\b/i.test(r.description);
  return all.filter(isFilm).concat(all.filter(r => !isFilm(r)));
}
async function wdSearch(text){
  const [film, generic] = await Promise.all([
    wdFilmSearch(text).catch(() => []),
    wdLabelSearch(text).catch(() => [])
  ]);
  const seen = new Set(film.map(r => r.id));
  return film.concat(generic.filter(r => !seen.has(r.id)));
}
// Wikidata ranks statements: deprecated ones are wrong/superseded (e.g. a
// cancelled release date), and a preferred one wins when present.
function claimValues(claims, p){
  const sts = (claims[p] || []).filter(c => c.rank !== 'deprecated' &&
    c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value != null);
  const pref = sts.filter(c => c.rank === 'preferred');
  return (pref.length ? pref : sts).map(c => c.mainsnak.datavalue.value);
}
// Many person items now carry their name only as a multilingual ("mul")
// label with no English one, so en-only lookups fall back to a raw Q-id.
function pickLabel(ent, fallback){
  const L = (ent && ent.labels) || {};
  return (L.en && L.en.value) || (L.mul && L.mul.value) || fallback || '';
}
async function wdResolve(id, fallbackLabel){
  const j = await wdApi({ action:'wbgetentities', ids:id, props:'claims|labels', languages:'en|mul' });
  const ent = j.entities && j.entities[id];
  const claims = (ent && ent.claims) || {};
  const title = pickLabel(ent, fallbackLabel);
  const years = claimValues(claims, 'P577')
    .map(v => v.time && parseInt(String(v.time).slice(1,5), 10))
    .filter(n => n && n > 1800);
  const year = years.length ? Math.min(...years) : '';
  const qids = {
    director: claimValues(claims,'P57').map(v => v.id).filter(Boolean),
    country:  claimValues(claims,'P495').map(v => v.id).filter(Boolean),
    genre:    claimValues(claims,'P136').map(v => v.id).filter(Boolean)
  };
  const uniq = [...new Set([].concat(qids.director, qids.country, qids.genre))];
  const labels = {};
  if (uniq.length){
    const lj = await wdApi({ action:'wbgetentities', ids:uniq.join('|'), props:'labels', languages:'en|mul' });
    for (const q of uniq) labels[q] = pickLabel(lj.entities && lj.entities[q], q);
  }
  const names = a => a.map(q => labels[q]).join(', ');
  const imdb = claimValues(claims,'P345').find(v => typeof v === 'string') || '';
  return {
    title, year,
    country: names(qids.country),
    director: names(qids.director),
    genre: names(qids.genre),
    imdbId: imdb
  };
}

/* ===================== canon lists (1001 / S&S) ===================== */
// Two reference lists, matched at render time on normalised title + year
// rather than stored per film, so every existing entry is covered without a

const LIST_ART = /^(the|a|an|le|la|les|l|il|el|lo|los|las|un|une|una|der|die|das|ein|eine|o|os)\s+/;
const LIST_NUM = {i:'1',ii:'2',iii:'3',iv:'4',v:'5',one:'1',two:'2',three:'3',four:'4',five:'5'};
function listKey(s){
  let t = String(s == null ? '' : s).normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  t = t.toLowerCase().replace(/&/g, ' and ').replace(/'/g, '');
  t = t.replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim().replace(LIST_ART, '');
  return t.split(' ').map(w => LIST_NUM[w] || w).join(' ').trim();
}
// on the 1001 list?
function on1001(e){
  const years = LIST_1001[listKey(e.title)];
  if (!years || !e.year) return false;
  const y = parseInt(e.year, 10);
  return years.some(ly => Math.abs(ly - y) <= 1);
}
// Sight & Sound rank, or 0
function ssRank(e){
  const hits = LIST_SS[listKey(e.title)];
  if (!hits || !e.year) return 0;
  const y = parseInt(e.year, 10);
  const m = hits.find(h => Math.abs(h[0] - y) <= 1);
  return m ? m[1] : 0;
}

/* ====================== fields (filter config) ====================== */
// Extensible: add a field here and it shows up in the form, the search
// scope dropdown, and free-text matching. No other wiring needed.
const FIELDS = [
  { key:'title',       label:'Title' },
  { key:'year',        label:'Year' },
  { key:'country',     label:'Country' },
  { key:'director',    label:'Director' },
  { key:'genre',       label:'Genre' },
  { key:'format',      label:'Format', options:['Streaming','DVD','Theater'] },
  { key:'watchType',   label:'Watch',  options:['New','Rewatch'] },
  { key:'dateWatched', label:'Date watched' }
];
const tokens = s => String(s == null ? '' : s).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
// Type-ahead matching: each term must start a word somewhere in the searched
// fields. "r" catches Rashomon and The Red Shoes (leading "The" doesn't hide
// it), "ra" narrows to Rashomon, and "rear win" finds Rear Window.
function entryMatches(e, q, fieldKey){
  const terms = tokens(q);
  if (!terms.length) return true;
  const keys = fieldKey === 'all' ? FIELDS.map(f => f.key) : [fieldKey];
  const words = keys.reduce((acc, k) => acc.concat(tokens(e[k])), []);
  return terms.every(t => words.some(w => w.startsWith(t)));
}

/* ============================== state =============================== */
const state = {
  tab:'marathon',
  monthKey: currentMonthKey(),
  months: [],            // month keys that exist in the repo, newest first
  docs: {},              // monthKey -> {doc, sha|null}
  notebook: { entries: [] },
  connected: false,
  loading: false,
  query:'', field:'all', scope:'month',
  loadingAll:false, allLoaded:false
};
const emptyMonthDoc = key => ({ month:key, theme:'', entries:[] });

async function loadMonths(){
  const items = await ghListDir('marathons');
  state.months = items
    .filter(i => /^\d{4}-\d{2}\.json$/.test(i.name))
    .map(i => i.name.slice(0,7))
    .sort().reverse();
}
async function loadMonth(key, force){
  if (!force && state.docs[key]) return state.docs[key];
  const r = await ghGetFile(marathonPath(key));
  state.docs[key] = r ? r : { doc: emptyMonthDoc(key), sha:null };
  return state.docs[key];
}
async function loadNotebook(){
  const r = await ghGetFile(NOTEBOOK_PATH);
  state.notebook = r ? r.doc : { entries: [] };
}
async function loadAll(){
  if (!ghConfigured()) return;
  state.loading = true;
  render();
  try{
    await Promise.all([loadMonths(), loadMonth(state.monthKey, true), loadNotebook()]);
    state.connected = true;
  }catch(e){
    state.connected = false;
    showErr(e);
  }
  state.loading = false;
  render();
  // fill in the rest of the months behind the first paint; the all-time
  // total and all-months search both need them, and it re-renders when done
  if (state.connected) ensureAllMonthsLoaded();
}
// every entry in every month file, current month included
function grandTotal(){
  return Object.keys(state.docs).reduce((sum, k) => sum + state.docs[k].doc.entries.length, 0);
}
async function ensureAllMonthsLoaded(){
  if (state.allLoaded || state.loadingAll) return;
  state.loadingAll = true;
  try{
    await Promise.all(state.months.map(k => loadMonth(k)));
    state.allLoaded = true;
  }catch(e){
    showErr(e);
  }
  state.loadingAll = false;
  render();
}

/* ============================== writes ============================== */
async function writeMonth(key, mutate, message){
  const r = await updateFile(marathonPath(key), emptyMonthDoc(key), mutate, message);
  state.docs[key] = r;
  if (!state.months.includes(key)){
    state.months.push(key);
    state.months.sort();
    state.months.reverse();
  }
  render();
}
async function deleteMonth(key, message){
  const fresh = await ghGetFile(marathonPath(key));
  if (fresh) await ghDeleteFile(marathonPath(key), fresh.sha, message);
  delete state.docs[key];
  state.months = state.months.filter(k => k !== key);
  if (state.monthKey === key) state.monthKey = currentMonthKey();
  // what's left in memory is still every remaining month, so allLoaded holds
  if (ghConfigured() && !state.docs[state.monthKey]){
    try{ await loadMonth(state.monthKey); }catch(e){ /* render shows empty; next action retries */ }
  }
  render();
}
async function writeNotebook(mutate, message){
  const r = await updateFile(NOTEBOOK_PATH, { entries: [] }, mutate, message);
  state.notebook = r.doc;
  render();
}

/* ============================== render ============================== */
function seqDay(entries, i){
  const e = entries[i];
  if (e.dateWatched && /^\d{4}-\d{2}-\d{2}/.test(e.dateWatched)){
    const d = parseInt(e.dateWatched.slice(8,10), 10);
    if (d) return d;
  }
  return i + 1;
}
// green tick = on the 1001 list, red tick = in the Sight & Sound 250.
// The rank is a hover tooltip on desktop, and a tap on the tick anywhere
// (iPad has no hover) — hence the button rather than a bare span.
function markHtml(e){
  let out = '';
  if (on1001(e)) out += ' <span class="mk mk1001" title="On the 1001 Movies list">✓</span>';
  const r = ssRank(e);
  if (r) out += ' <button class="mk mkss" data-ss="' + r + '" title="Sight &amp; Sound 250 — ranked ' +
    r + '">✓</button>';
  return out;
}
function entryRowHtml(e, i, key, showMonth){
  const day = seqDay((state.docs[key] ? state.docs[key].doc.entries : []), i);
  // 'New' is the common case, so only a rewatch is worth the row space
  const sub = [e.director, e.country, e.genre, e.format,
    e.watchType === 'Rewatch' ? 'Rewatch' : ''].filter(Boolean).join(' · ');
  return '<div class="row" data-key="' + esc(key) + '" data-i="' + i + '">' +
    '<div class="day">' + day + '</div>' +
    '<div class="meat">' +
      '<div class="t">' + esc(e.title) + (e.year ? ' <span class="yr">' + esc(e.year) + '</span>' : '') +
        markHtml(e) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
      (showMonth ? '<div class="mo">' + esc(monthLabel(key)) + '</div>' : '') +
    '</div>' +
    (e.imdbId ? '<a class="imdb" target="_blank" rel="noopener" href="https://www.imdb.com/title/' +
      encodeURIComponent(e.imdbId) + '/">IMDb</a>' : '') +
  '</div>';
}
function renderMonthSelect(){
  const cur = currentMonthKey();
  // A past month that never got a film is clutter — a marathon that didn't
  // happen. Hide it, but never hide the current month or the one open right
  // now (it may have just been started for backfill), and don't hide a month
  // whose file hasn't loaded yet, since its count isn't known.
  const listed = state.months.filter(k =>
    k === cur || k === state.monthKey || k >= cur ||
    !state.docs[k] || state.docs[k].doc.entries.length > 0);
  const keys = [...new Set([cur, state.monthKey, ...listed])].sort().reverse();
  $('monthSelect').innerHTML = keys.map(k =>
    '<option value="' + esc(k) + '"' + (k === state.monthKey ? ' selected' : '') + '>' +
    esc(monthLabel(k)) + (k === currentMonthKey() ? ' · current' : '') + '</option>'
  ).join('') + '<option value="__new">＋ Start another month…</option>';
}
function renderFieldSelect(){
  $('fieldSelect').innerHTML =
    '<option value="all">All fields</option>' +
    FIELDS.map(f => '<option value="' + f.key + '"' + (state.field === f.key ? ' selected' : '') + '>' +
      esc(f.label) + '</option>').join('');
}
function renderEntryList(){
  const box = $('entryList');
  if (state.loading){ box.innerHTML = '<div class="empty"><span class="spin"></span>Loading…</div>'; return; }
  if (state.scope === 'all' && state.query){
    if (!state.allLoaded){
      ensureAllMonthsLoaded();
      box.innerHTML = '<div class="empty"><span class="spin"></span>Loading every month…</div>';
      return;
    }
    const keys = [...new Set([...state.months, currentMonthKey()])].sort().reverse();
    let html = '', hits = 0;
    for (const k of keys){
      const d = state.docs[k];
      if (!d) continue;
      const rows = d.doc.entries
        .map((e, i) => ({ e, i }))
        .filter(x => entryMatches(x.e, state.query, state.field));
      if (!rows.length) continue;
      hits += rows.length;
      html += '<div class="grouphead">' + esc(monthLabel(k)) + '</div>' +
              rows.map(x => entryRowHtml(x.e, x.i, k, false)).join('');
    }
    box.innerHTML = html || '<div class="empty">No matches in any month.</div>';
    return;
  }
  const cur = state.docs[state.monthKey];
  const entries = cur ? cur.doc.entries : [];
  const rows = entries
    .map((e, i) => ({ e, i }))
    .filter(x => entryMatches(x.e, state.query, state.field));
  if (!entries.length){
    box.innerHTML = '<div class="empty">' + (state.connected ?
      'No movies yet this month.<br>Tap below to add today’s.' :
      'Connect GitHub (⚙) to load your marathons.') + '</div>';
  }else if (!rows.length){
    box.innerHTML = '<div class="empty">Nothing matches that search.</div>';
  }else{
    box.innerHTML = rows.map(x => entryRowHtml(x.e, x.i, state.monthKey, false)).join('');
  }
}
function renderMarathon(){
  renderMonthSelect();
  const cur = state.docs[state.monthKey];
  const themeEl = $('themeInput');
  if (document.activeElement !== themeEl) themeEl.value = cur ? (cur.doc.theme || '') : '';
  const n = cur ? cur.doc.entries.length : 0;
  const isCurrent = state.monthKey === currentMonthKey();
  let prog = n + (n === 1 ? ' movie' : ' movies') + ' · ' + daysInMonth(state.monthKey) + ' days';
  if (isCurrent) prog += ' · today is day ' + parseInt(todayISO().slice(8,10), 10);
  // only once every month is in hand, so the running total is never a
  // half-loaded undercount
  if (state.allLoaded) prog += ' · ' + grandTotal() + ' all time';
  $('progress').textContent = prog;
  $('addBtn').textContent = isCurrent ? '＋ Add today’s movie' : '＋ Add a movie';
  renderEntryList();
}
function renderNotebook(){
  const list = state.notebook.entries || [];
  $('nbList').innerHTML = list.length ?
    list.map((e, i) =>
      '<div class="note" data-i="' + i + '">' + esc(e.text) +
      (e.added ? '<div class="when">' + esc(String(e.added).slice(0,10)) + '</div>' : '') +
      '</div>').join('') :
    '<div class="empty">Nothing jotted yet.<br>Directors, decades, countries, stray ideas — anything.</div>';
}
function render(){
  $('setupBanner').hidden = ghConfigured();
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === state.tab));
  $('view-marathon').hidden = state.tab !== 'marathon';
  $('view-notebook').hidden = state.tab !== 'notebook';
  $('addBtn').hidden = state.tab !== 'marathon';
  if (state.tab === 'marathon') renderMarathon(); else renderNotebook();
}

/* Wikidata picker: search box + candidate list; onPick(resolvedEntry) */
function openPicker(prefill, onPick){
  openPickerModal(
    '<div class="mhead"><h2>Find the film</h2><button class="x" id="pkClose">×</button></div>' +
    '<div class="field"><input id="pkQuery" type="search" placeholder="Title…" autocomplete="off" value="' + esc(prefill || '') + '"></div>' +
    '<div id="pkResults"></div>' +
    '<p class="help">Results come from Wikidata. Pick the right one — the description tells them apart (year, director).</p>'
  );
  const input = $('pkQuery');
  const results = $('pkResults');
  let seq = 0;
  async function run(){
    const q = input.value.trim();
    if (!q){ results.innerHTML = ''; return; }
    const mySeq = ++seq;
    results.innerHTML = '<div class="searching"><span class="spin"></span>Searching…</div>';
    let cands;
    try{ cands = await wdSearch(q); }
    catch(e){ if (mySeq === seq) results.innerHTML = '<div class="searching">Wikidata unreachable — try again.</div>'; return; }
    if (mySeq !== seq) return;
    results.innerHTML = cands.length ?
      cands.map((c, i) =>
        '<button class="cand" data-i="' + i + '"><div>' + esc(c.label) + '</div>' +
        '<div class="d">' + esc(c.description || 'no description') + '</div></button>').join('') :
      '<div class="searching">Nothing found — check the spelling, or add it manually.</div>';
    results.querySelectorAll('.cand').forEach(btn => btn.addEventListener('click', async () => {
      const c = cands[+btn.dataset.i];
      results.innerHTML = '<div class="searching"><span class="spin"></span>Fetching details…</div>';
      try{
        const entry = await wdResolve(c.id, c.label);
        closePicker();
        onPick(entry);
      }catch(e){
        showErr(e);
        run();
      }
    }));
  }
  let deb = null;
  input.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(run, 400); });
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ clearTimeout(deb); run(); } });
  $('pkClose').addEventListener('click', closePicker);
  if (prefill) run();
  setTimeout(() => input.focus(), 60);
}

function openEntryForm(opts){

  const fieldHtml = (key, label, extra) =>

    '<input id="f_' + key + '" type="text" ' + (extra || '') + ' value="' + esc(e[key] == null ? '' : e[key]) + '" autocomplete="off"></div>';

  const selectHtml = key => {
    const f = FIELDS.find(x => x.key === key);
    return '<div class="field"><label>' + esc(f.label) + '</label>' +
      '<select id="f_' + key + '"><option value="">—</option>' +
      (f.options || []).map(o =>
        '<option' + (e[key] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
      '</select></div>';
  };
  openModal(
    '<div class="mhead"><h2>' + esc(opts.title || 'Movie') + '</h2><button class="x" id="efClose">×</button></div>' +
    fieldHtml('title','Title') +
    '<div class="frow">' +
      fieldHtml('year','Year','inputmode="numeric"') +
      '<div class="field"><label>Date watched</label><input id="f_dateWatched" type="date" value="' + esc(e.dateWatched || '') + '"></div>' +
    '</div>' +
    fieldHtml('director','Director') +
    fieldHtml('country','Country') +
    fieldHtml('genre','Genre') +
    '<div class="frow">' + selectHtml('format') + selectHtml('watchType') + '</div>' +
    fieldHtml('imdbId','IMDb ID','placeholder="tt0069293"') +
    (opts.searchAgain ? '<button class="linky" id="efSearch">↻ Search Wikidata instead</button>' : '') +
    '<div class="mbtns">' +
      (opts.onDelete ? '<button class="btn danger" id="efDelete">Delete</button>' : '') +
      '<button class="btn plain" id="efCancel">Cancel</button>' +
      '<button class="btn primary" id="efSave">Save</button>' +
    '</div>'
  );
  $('efClose').addEventListener('click', closeModal);
  $('efCancel').addEventListener('click', closeModal);
  if (opts.searchAgain) $('efSearch').addEventListener('click', () =>
    openPicker($('f_title').value.trim(), entry => {
      for (const f of FIELDS){ if (f.key !== 'dateWatched' && entry[f.key] != null) $('f_' + f.key).value = entry[f.key]; }
      $('f_imdbId').value = entry.imdbId || '';
    }));
  if (opts.onDelete) $('efDelete').addEventListener('click', () => {
    if (confirm('Delete “' + ($('f_title').value.trim() || 'this movie') + '” from the month?')){
      closeModal();
      opts.onDelete();
    }
  });
  $('efSave').addEventListener('click', () => {
    const out = {};
    for (const f of FIELDS){
      const v = $('f_' + f.key).value.trim();
      if (f.key === 'year'){ out.year = v ? (parseInt(v,10) || v) : ''; }
      else if (f.key === 'dateWatched'){ if (v) out.dateWatched = v; }
      else out[f.key] = v;
    }
    out.imdbId = $('f_imdbId').value.trim();
    if (!out.title){ toast('A title is required', true); return; }
    closeModal();
    opts.onSave(out);
  });
}

/* ============================ live add ============================== */
function startAddFlow(){
  if (!ghConfigured()){ openSettings(); return; }
  const key = state.monthKey;
  const isCurrent = key === currentMonthKey();
  openPicker('', picked => {
    if (isCurrent && !picked.dateWatched) picked.dateWatched = todayISO();
    if (!picked.watchType) picked.watchType = 'New';
    openEntryForm({
      title:'Add to ' + monthLabel(key),
      entry: picked,
      searchAgain: true,
      onSave: entry => saveNewEntry(key, entry)
    });
  });
  // manual escape hatch under the picker
  $('pkResults').insertAdjacentHTML('afterend',
    '<button class="linky" id="pkManual">Skip the lookup — type it in manually</button>');
  $('pkManual').addEventListener('click', () => {
    closePicker();
    openEntryForm({
      title:'Add to ' + monthLabel(key),
      entry: isCurrent ? { dateWatched: todayISO(), watchType:'New' } : { watchType:'New' },
      searchAgain: true,
      onSave: entry => saveNewEntry(key, entry)
    });
  });
}
async function saveNewEntry(key, entry){
  try{
    await writeMonth(key, doc => doc.entries.push(entry),
      'Add “' + entry.title + '” to ' + key);
    toast('Added ' + entry.title);
  }catch(e){ showErr(e); }
}
function openEditEntry(key, index){
  const d = state.docs[key];
  if (!d || !d.doc.entries[index]) return;
  openEntryForm({
    title:'Edit · ' + monthLabel(key),
    entry: d.doc.entries[index],
    searchAgain: true,
    onSave: async entry => {
      try{
        await writeMonth(key, doc => { if (doc.entries[index]) doc.entries[index] = entry; },
          'Edit “' + entry.title + '” (' + key + ')');
        toast('Saved');
      }catch(e){ showErr(e); }
    },
    onDelete: async () => {
      const title = d.doc.entries[index].title;
      const lastOne = d.doc.entries.length === 1;
      if (lastOne && confirm('That was the last movie in ' + monthLabel(key) +
          '. Delete the whole month too (including its theme)?')){
        try{
          await deleteMonth(key, 'Delete ' + key + ' (last movie removed)');
          toast('Deleted ' + monthLabel(key));
        }catch(e){ showErr(e); }
        return;
      }
      try{
        await writeMonth(key, doc => { doc.entries.splice(index, 1); },
          'Delete “' + title + '” (' + key + ')');
        toast('Deleted ' + title);
      }catch(e){ showErr(e); }
    }
  });
}

/* ============================ new month ============================= */
// Start any month (usually a past one) so movies can be added to it one
// at a time. The file itself is created on the first save into it.
function openNewMonth(){
  if (!ghConfigured()){ openSettings(); return; }
  const d = new Date();
  d.setMonth(d.getMonth() - 1);
  const defYear = d.getFullYear(), defMonth = d.getMonth() + 1;
  const thisYear = new Date().getFullYear();
  const years = [];
  for (let y = thisYear; y >= thisYear - 20; y--) years.push(y);
  // Two selects, not <input type="month"> — Safari (iPad included) doesn't
  // support that type and silently degrades it to a text box.
  openModal(
    '<div class="mhead"><h2>Start another month</h2><button class="x" id="nmClose">×</button></div>' +
    '<div class="frow">' +
      '<div class="field"><label>Month</label><select id="nmMonth">' +
        MONTHS.map((m, i) => '<option value="' + (i+1) + '"' + (i+1 === defMonth ? ' selected' : '') +
          '>' + m + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Year</label><select id="nmYear">' +
        years.map(y => '<option' + (y === defYear ? ' selected' : '') + '>' + y + '</option>').join('') +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>Theme (optional)</label><input id="nmTheme" type="text" autocomplete="off"></div>' +
    '<div class="mbtns"><button class="btn plain" id="nmCancel">Cancel</button>' +
    '<button class="btn primary" id="nmGo">Open month</button></div>' +
    '<p class="help">Opens that month so you can add movies to it one at a time — same lookup flow as today’s.</p>'
  );
  $('nmClose').addEventListener('click', closeModal);
  $('nmCancel').addEventListener('click', closeModal);
  $('nmGo').addEventListener('click', async () => {
    const key = $('nmYear').value + '-' + String(+$('nmMonth').value).padStart(2,'0');
    if (!/^\d{4}-\d{2}$/.test(key)){ toast('Pick a month first', true); return; }
    const theme = $('nmTheme').value.trim();
    closeModal();
    state.monthKey = key;
    render();
    try{
      await loadMonth(key);
      if (theme && (state.docs[key].doc.theme || '') !== theme){
        await writeMonth(key, doc => { doc.theme = theme; }, 'Set theme for ' + key);
      }
    }catch(e){ showErr(e); }
    render();
    toast(monthLabel(key) + ' is open — add movies below');
  });
}

/* ============================ settings ============================== */
function openSettings(){
  const c = gh();
  openModal(
    '<div class="mhead"><h2>Settings</h2><button class="x" id="stClose">×</button></div>' +
    '<p class="help">Marathons and the notebook live as JSON in a private GitHub repo. Paste the shared fine-grained token (Contents: read &amp; write on the data repo). Nothing leaves this browser except calls to api.github.com and wikidata.org.</p>' +
    '<div class="field"><label>Access token</label><input id="stToken" type="password" value="' + esc(c.token) + '" placeholder="github_pat_…" autocomplete="off"></div>' +
    '<div class="frow">' +
      '<div class="field"><label>Owner</label><input id="stOwner" type="text" value="' + esc(c.owner) + '" autocomplete="off"></div>' +
      '<div class="field"><label>Data repo</label><input id="stRepo" type="text" value="' + esc(c.repo) + '" autocomplete="off"></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn plain" id="stCancel">Cancel</button>' +
    '<button class="btn primary" id="stSave">Save &amp; connect</button></div>' +
    '<p class="help" id="stNote"></p>'
  );
  $('stClose').addEventListener('click', closeModal);
  $('stCancel').addEventListener('click', closeModal);
  $('stSave').addEventListener('click', async () => {
    cfgSet('token', $('stToken').value.trim());
    cfgSet('owner', $('stOwner').value.trim() || 'clwesterl');
    cfgSet('repo', $('stRepo').value.trim() || 'movie-months-data');
    const note = $('stNote');
    note.innerHTML = '<span class="spin"></span>Checking the repo…';
    try{
      const cc = gh();
      const res = await fetch('https://api.github.com/repos/' + encodeURIComponent(cc.owner) + '/' +
        encodeURIComponent(cc.repo), { headers: ghHeaders(), cache:'no-store' });
      if (res.status === 401 || res.status === 403){
        note.textContent = 'Token rejected (HTTP ' + res.status + '). Check the token, its expiry, and that it grants Contents: read/write on ' + cc.owner + '/' + cc.repo + '.';
        return;
      }
      if (res.status === 404){
        note.textContent = 'Repo not found with this token. Confirm ' + cc.owner + '/' + cc.repo + ' exists and the token’s repository access includes it (Only select repositories → tick it).';
        return;
      }
      if (!res.ok){ note.textContent = 'Could not reach GitHub (HTTP ' + res.status + ').'; return; }
      closeModal();
      toast('Connected');
      state.docs = {};
      state.allLoaded = false;
      loadAll();
    }catch(e){
      note.textContent = 'Network error — are you online?';
    }
  });
}

/* ============================== wiring ============================== */
function init(){
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    state.tab = b.dataset.tab;
    render();
  }));
  $('settingsBtn').addEventListener('click', openSettings);
  $('setupBtn').addEventListener('click', openSettings);
  $('addBtn').addEventListener('click', startAddFlow);

  $('monthSelect').addEventListener('change', async ev => {
    if (ev.target.value === '__new'){
      render();          // snap the select back to the real month
      openNewMonth();
      return;
    }
    state.monthKey = ev.target.value;
    render();
    if (ghConfigured()){
      try{ await loadMonth(state.monthKey); }catch(e){ showErr(e); }
      render();
    }
  });
  $('themeInput').addEventListener('change', async ev => {
    if (!ghConfigured()) return;
    const v = ev.target.value.trim();
    const cur = state.docs[state.monthKey];
    if (cur && (cur.doc.theme || '') === v) return;
    try{
      await writeMonth(state.monthKey, doc => { doc.theme = v; }, 'Set theme for ' + state.monthKey);
      toast('Theme saved');
    }catch(e){ showErr(e); }
  });

  let deb = null;
  $('searchInput').addEventListener('input', ev => {
    clearTimeout(deb);
    deb = setTimeout(() => { state.query = ev.target.value.trim(); renderEntryList(); }, 250);
  });
  $('fieldSelect').addEventListener('change', ev => { state.field = ev.target.value; renderEntryList(); });
  $('scopeSelect').addEventListener('change', ev => { state.scope = ev.target.value; renderEntryList(); });

  $('entryList').addEventListener('click', ev => {
    if (ev.target.closest('a')) return;
    const tick = ev.target.closest('.mkss');
    if (tick){                              // show the rank instead of editing
      toast('Sight & Sound 250 — ranked ' + tick.dataset.ss);
      return;
    }
    const row = ev.target.closest('.row');
    if (row) openEditEntry(row.dataset.key, +row.dataset.i);
  });

  $('nbAddBtn').addEventListener('click', addNote);
  $('nbInput').addEventListener('keydown', ev => { if (ev.key === 'Enter') addNote(); });
  $('nbList').addEventListener('click', async ev => {
    const note = ev.target.closest('.note');
    if (!note) return;
    const i = +note.dataset.i;
    const e = state.notebook.entries[i];
    if (!e) return;
    if (!confirm('Delete this note?\n\n“' + e.text + '”')) return;
    try{
      await writeNotebook(doc => {
        const idx = doc.entries.findIndex(x => x.text === e.text && x.added === e.added);
        doc.entries.splice(idx >= 0 ? idx : i, 1);
      }, 'Notebook: delete note');
      toast('Note deleted');
    }catch(err){ showErr(err); }
  });

  // close modals when tapping the dimmed backdrop
  $('overlay').addEventListener('click', ev => { if (ev.target === $('overlay')) closeModal(); });
  $('pickerOverlay').addEventListener('click', ev => { if (ev.target === $('pickerOverlay')) closePicker(); });

  renderFieldSelect();
  render();
  if (ghConfigured()) loadAll();
}
async function addNote(){
  if (!ghConfigured()){ openSettings(); return; }
  const input = $('nbInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try{
    await writeNotebook(doc => doc.entries.unshift({ text, added: new Date().toISOString() }),
      'Notebook: add note');
    toast('Noted');
  }catch(e){
    input.value = text;
    showErr(e);
  }
}
init();
</script>
